; Reference copy of the canonical .editorconfig. Copy to a project root as
; `.editorconfig` — EditorConfig has no `extends`, so adoption is a copy.
root = true

[*]
charset = utf-8
end_of_line = lf
insert_final_newline = true
indent_style = space
indent_size = 2

[*.gd]
indent_style = tab

[*.rs]
indent_size = 4

[*.{ps1,bat}]
end_of_line = crlf
